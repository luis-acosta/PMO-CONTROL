version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pmo_user
      POSTGRES_PASSWORD: pmo_password
      POSTGRES_DB: pmo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pdinet

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://pmo_user:pmo_password@db:5432/pmo_db
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-pmo_secret_key}
    depends_on:
      - db
    networks:
      - pdinet
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=pdinet
        - traefik.http.routers.pmo-app.rule=Host(`mto.pdiadvanced.cloud`)
        - traefik.http.routers.pmo-app.entrypoints=websecure
        - traefik.http.routers.pmo-app.tls.certresolver=letsencryptresolver
        - traefik.http.services.pmo-app.loadbalancer.server.port=3001

volumes:
  postgres_data:

networks:
  pdinet:
    external: true


